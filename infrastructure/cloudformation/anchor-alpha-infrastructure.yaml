AWSTemplateFormatVersion: '2010-09-09'
Description: 'AnchorAlpha Momentum Screener Infrastructure - Lambda, S3, EventBridge, ECS, and Monitoring'

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Environment name

  FMPApiKey:
    Type: String
    NoEcho: true
    Description: Financial Modeling Prep API Key

  NotificationEmail:
    Type: String
    Description: Email address for budget and error notifications
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'

  SubnetIds:
    Type: CommaDelimitedList
    Default: "subnet-c70c49e9,subnet-2389b82c,subnet-0f404e45"
    Description: Default VPC public subnet IDs for Fargate task

Resources:

  # ─── S3 ────────────────────────────────────────────────────────────────────

  MomentumDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'anchor-alpha-momentum-data-${Environment}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldData
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpirationInDays: 30
      VersioningConfiguration:
        Status: Enabled

  S3AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/s3/anchor-alpha-momentum-data-${Environment}'
      RetentionInDays: 30

  # ─── LAMBDA ────────────────────────────────────────────────────────────────

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'AnchorAlpha-Lambda-ExecutionRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub 'arn:aws:s3:::anchor-alpha-momentum-data-${Environment}-${AWS::AccountId}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::anchor-alpha-momentum-data-${Environment}-${AWS::AccountId}'
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref FMPApiKeySecret
        - PolicyName: SQSDeadLetterQueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ErrorNotificationQueue.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/anchor-alpha-*'

  FMPApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'anchor-alpha/fmp-api-key-${Environment}'
      Description: 'Financial Modeling Prep API Key for AnchorAlpha'
      SecretString: !Ref FMPApiKey

  MomentumProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'anchor-alpha-momentum-processor-${Environment}'
      Runtime: python3.11
      Handler: AnchorAlpha.lambda_function.handler.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Sub 'anchor-alpha-lambda-code-${AWS::AccountId}'
        S3Key: 'lambda-deployment.zip'
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          S3_BUCKET: !Ref MomentumDataBucket
          FMP_API_KEY_SECRET: !Ref FMPApiKeySecret
      DeadLetterConfig:
        TargetArn: !GetAtt ErrorNotificationQueue.Arn

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/anchor-alpha-momentum-processor-${Environment}'
      RetentionInDays: 30

  DailyScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'anchor-alpha-daily-schedule-${Environment}'
      Description: 'Trigger momentum processing daily after market close'
      ScheduleExpression: 'cron(30 21 ? * MON-FRI *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt MomentumProcessorFunction.Arn
          Id: MomentumProcessorTarget
          Input: !Sub |
            {
              "source": "eventbridge",
              "environment": "${Environment}",
              "trigger_time": "daily_schedule"
            }

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MomentumProcessorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyScheduleRule.Arn

  # ─── NOTIFICATIONS & MONITORING ────────────────────────────────────────────

  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'anchor-alpha-notifications-${Environment}'
      DisplayName: 'AnchorAlpha System Notifications'

  EmailNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      TopicArn: !Ref NotificationTopic
      Endpoint: !Ref NotificationEmail

  ErrorNotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'anchor-alpha-errors-${Environment}'
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 60

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'AnchorAlpha-Lambda-Errors-${Environment}'
      AlarmDescription: 'Alert when Lambda function has errors'
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref MomentumProcessorFunction
      AlarmActions:
        - !Ref NotificationTopic

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'AnchorAlpha-Lambda-Duration-${Environment}'
      AlarmDescription: 'Alert when Lambda function takes too long'
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 600000
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref MomentumProcessorFunction
      AlarmActions:
        - !Ref NotificationTopic

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub 'AnchorAlpha-Monthly-Budget-${Environment}'
        BudgetLimit:
          Amount: 150
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail

  # ─── ECR ───────────────────────────────────────────────────────────────────

  TradingBotECRRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: anchoralpha-trading
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 5 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 5
              },
              "action": { "type": "expire" }
            }]
          }

  # ─── ECS ───────────────────────────────────────────────────────────────────

  TradingBotCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: anchoralpha
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  TradingBotLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/anchoralpha-trading
      RetentionInDays: 30

  # Execution role: allows ECS to pull Docker image from ECR and write logs
  TradingBotExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'AnchorAlpha-ECS-ExecutionRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:anchoralpha/*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:anchor-alpha/*'

  # Task role: permissions the running container has at runtime
  TradingBotTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'AnchorAlpha-ECS-TaskRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub 'arn:aws:s3:::anchor-alpha-momentum-data-${Environment}-${AWS::AccountId}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::anchor-alpha-momentum-data-${Environment}-${AWS::AccountId}'
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:anchoralpha/*'
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:anchor-alpha/*'
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt TradingBotLogGroup.Arn

  TradingBotTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: anchoralpha-trading
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt TradingBotExecutionRole.Arn
      TaskRoleArn: !GetAtt TradingBotTaskRole.Arn
      ContainerDefinitions:
        - Name: trading-bot
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/anchoralpha-trading:latest'
          Essential: true
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: S3_BUCKET
              Value: !Sub 'anchor-alpha-momentum-data-${Environment}-${AWS::AccountId}'
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: CLAUDE_SECRET_NAME
              Value: anchoralpha/claude
            - Name: ALPACA_PAPER_SECRET_NAME
              Value: anchoralpha/alpaca-paper
            - Name: ALPHAVANTAGE_SECRET_NAME
              Value: anchoralpha/alphavantage
            - Name: FMP_SECRET_NAME
              Value: anchor-alpha/fmp-api-key-prod
            - Name: DASHBOARD_SECRET_NAME
              Value: anchoralpha/dashboard
            - Name: ALPACA_PAPER_BASE_URL
              Value: https://paper-api.alpaca.markets/v2
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/anchoralpha-trading
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: trading

  # ─── EVENTBRIDGE SCHEDULER (start trading task Mon-Fri 8:30 AM ET) ─────────

  TradingBotSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'AnchorAlpha-Scheduler-Role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunECSTask
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref TradingBotTaskDefinition
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TradingBotExecutionRole.Arn
                  - !GetAtt TradingBotTaskRole.Arn

  StartTradingSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub 'anchoralpha-start-trading-${Environment}'
      Description: 'Start trading engine Mon-Fri at 8:30 AM ET (13:30 UTC)'
      ScheduleExpression: 'cron(30 13 ? * MON-FRI *)'
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt TradingBotCluster.Arn
        RoleArn: !GetAtt TradingBotSchedulerRole.Arn
        EcsParameters:
          TaskDefinitionArn: !Ref TradingBotTaskDefinition
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              Subnets: !Ref SubnetIds
              AssignPublicIp: ENABLED

Outputs:
  S3BucketName:
    Description: 'Name of the S3 bucket for momentum data'
    Value: !Ref MomentumDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-S3Bucket'

  LambdaFunctionArn:
    Description: 'ARN of the Lambda function'
    Value: !GetAtt MomentumProcessorFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'

  LambdaFunctionName:
    Description: 'Name of the Lambda function'
    Value: !Ref MomentumProcessorFunction
    Export:
      Name: !Sub '${AWS::StackName}-LambdaName'

  NotificationTopicArn:
    Description: 'ARN of the SNS notification topic'
    Value: !Ref NotificationTopic
    Export:
      Name: !Sub '${AWS::StackName}-NotificationTopic'

  FMPApiKeySecretArn:
    Description: 'ARN of the FMP API Key secret'
    Value: !Ref FMPApiKeySecret
    Export:
      Name: !Sub '${AWS::StackName}-FMPSecret'

  EventBridgeRuleArn:
    Description: 'ARN of the EventBridge rule'
    Value: !GetAtt DailyScheduleRule.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ScheduleRule'

  ECRRepositoryUri:
    Description: 'URI of the ECR repository for the trading bot image'
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/anchoralpha-trading'
    Export:
      Name: !Sub '${AWS::StackName}-ECRRepo'

  ECSClusterName:
    Description: 'Name of the ECS cluster'
    Value: !Ref TradingBotCluster
    Export:
      Name: !Sub '${AWS::StackName}-ECSCluster'

  TradingTaskDefinitionArn:
    Description: 'ARN of the trading bot task definition'
    Value: !Ref TradingBotTaskDefinition
    Export:
      Name: !Sub '${AWS::StackName}-TaskDefinition'
